# Builds the APK from this exact source on GitHub's servers, so anyone can check
# that the published APK comes from the code in this repository.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Checks that gradle-wrapper.jar is the genuine one published by Gradle.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The release key lives in repository secrets, never in the code.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MAXCLEAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MAXCLEAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::No release key in secrets: a release must not be signed with a throwaway key."
            exit 1
          else
            echo "No release key: this build is signed with a debug key."
          fi

      # Builds with Gradle's dependency verification: every downloaded library must match
      # the SHA-256 in gradle/verification-metadata.xml, or the build stops.
      - name: Build
        env:
          MAXCLEAN_STORE_PASSWORD: ${{ secrets.MAXCLEAN_STORE_PASSWORD }}
          MAXCLEAN_KEY_ALIAS: ${{ secrets.MAXCLEAN_KEY_ALIAS }}
          MAXCLEAN_KEY_PASSWORD: ${{ secrets.MAXCLEAN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleLiteRelease assembleFullRelease --no-daemon

      - name: SHA-256 and signing certificate
        run: |
          cp app/build/outputs/apk/lite/release/app-lite-release.apk Maxclean.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk Maxclean-Full.apk
          sha256sum Maxclean.apk Maxclean-Full.apk | tee SHA256SUMS.txt
          for f in Maxclean.apk Maxclean-Full.apk; do
            "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$f" | grep -E "SHA-256|DN"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: Maxclean-apk
          path: |
            Maxclean.apk
            Maxclean-Full.apk
            SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Maxclean.apk
            Maxclean-Full.apk
            SHA256SUMS.txt

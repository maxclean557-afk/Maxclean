# Builds the APK from this exact source on GitHub's servers, so anyone can check
# that the published APK comes from the code in this repository.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: SHA-256 of the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Maxclean.apk
          sha256sum Maxclean.apk | tee Maxclean.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Maxclean-apk
          path: |
            Maxclean.apk
            Maxclean.apk.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Maxclean.apk
            Maxclean.apk.sha256

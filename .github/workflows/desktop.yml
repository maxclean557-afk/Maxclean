# Builds the Windows version (Maxclean Full for desktop) from this exact source on GitHub's
# servers. Tor comes from the official Tor Expert Bundle, checked against the Tor Project's key.
name: Build Windows

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Tor (signature-checked)
        run: bash scripts/fetch-tor.sh

      # npm ci installs exactly what package-lock.json lists, with its integrity hashes.
      - name: Build
        run: |
          npm ci
          npx electron-builder --win nsis portable --publish never

      - name: SHA-256
        run: |
          cd dist
          sha256sum Maxclean-Full-*-setup.exe Maxclean-Full-*-portable.exe | tee SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v5
        with:
          name: Maxclean-windows
          path: |
            desktop/dist/Maxclean-Full-*-setup.exe
            desktop/dist/Maxclean-Full-*-portable.exe
            desktop/dist/SHA256SUMS-windows.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Maxclean 1.3 Full для Windows
          # Keeps the Android release as "latest", so the APK links in the README keep working.
          make_latest: false
          files: |
            desktop/dist/Maxclean-Full-*-setup.exe
            desktop/dist/Maxclean-Full-*-portable.exe
            desktop/dist/SHA256SUMS-windows.txt

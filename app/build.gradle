plugins {
    id 'com.android.application'
}

// Release signing key. Locally it comes from keystore.properties (never committed), on GitHub
// Actions from repository secrets. Without either, the build falls back to a debug key, so
// anyone can still build the app from source.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStore = signingValue('storeFile', 'MAXCLEAN_KEYSTORE')

android {
    namespace 'az.maxclean.browser'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'az.maxclean.browser'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile rootProject.file(releaseStore)
                storePassword signingValue('storePassword', 'MAXCLEAN_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'MAXCLEAN_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'MAXCLEAN_KEY_PASSWORD')
            }
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseStore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // Tor itself (Guardian Project, the makers of Orbot), 0.4.8 long-term-support branch
    implementation 'info.guardianproject:tor-android:0.4.8.22'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    // Bridges: obfs4, Snowflake, WebTunnel (also from the Orbot team)
    implementation 'com.netzarchitekten:IPtProxy:5.5.1'
}

// Copies the browser's own source code into assets so the "Код браузера" screen can show it.
tasks.register('bundleSource', Copy) {
    from('src/main/java') { into 'java' }
    from('src/main/res') { into 'res' }
    from('src/main') { include 'AndroidManifest.xml' }
    from('.') { include 'build.gradle' }
    into 'src/main/assets/source'
}
preBuild.dependsOn bundleSource
